# Redmine 7.0.1 plugin test environment for redmine_reader.
#
# Builds a custom image from ./Dockerfile (official redmine:7.0.1 + the boot
# orchestrator entrypoint.sh), then starts Redmine + PostgreSQL.
#
# Boot orchestration (see ./entrypoint.sh):
#   first boot:  core db:migrate -> start bare Redmine (no plugin) ->
#                git clone the plugin repo -> redmine:plugins:migrate ->
#                restart with the plugin loaded
#   later boots: core db:migrate -> plugin migrations -> start Redmine
#
# Usage:  docker compose up -d --build   then open http://localhost:8080
#         (admin / admin — first login forces a password change)

name: redmine-reader-test

services:
  db:
    image: postgres:16-alpine
    container_name: redmine_reader_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: redmine
      POSTGRES_DB: redmine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Redmine's migration chain must not start until PostgreSQL really
      # accepts connections (pg_isready checks the actual socket).
      test: ["CMD-SHELL", "pg_isready -U redmine -d redmine"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not exposed to the host: only the Redmine container talks to it.

  redmine:
    # Custom image: official redmine:7.0.1 + the boot orchestrator
    # (see Dockerfile). The plugin itself is cloned at runtime by
    # entrypoint.sh, not baked into the image.
    build: .
    image: redmine-reader:7.0.1
    container_name: redmine_reader_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # External access: host 8080 -> container 3000.
      - "8080:3000"
    environment:
      RAILS_ENV: production
      # Fixed secret so sessions survive container recreation (test only).
      SECRET_KEY_BASE: "redmine_reader_test_secret_key_base_change_me"
    volumes:
      # Explicit database config (we bypass the image entrypoint's
      # REDMINE_DB_* generation by running a custom command).
      - ./redmine/database.yml:/usr/src/redmine/config/database.yml:ro
      # Persist uploaded attachments across container recreation.
      - redmine_files:/usr/src/redmine/files
    command:
      # Boot orchestration: first boot starts bare, clones the plugin after
      # the server is ready, migrates, then restarts with the plugin.
      - /usr/local/bin/redmine-entrypoint.sh

volumes:
  postgres_data:
    # PostgreSQL data — survives `docker compose down`, removed by `down -v`.
  redmine_files:
    # Uploaded attachments.
