# CodeBuddy 记忆自动同步配置（仓库备份）
# 此文件是 ~/.codebuddy/automations/memory-sync/automation.toml 的持久化副本，
# 用于在 CNB 云原生开发环境重建后恢复自动化任务。
# 恢复方式：运行 .codebuddy/restore.sh 或手动复制本文件到
#   $HOME/.codebuddy/automations/memory-sync/automation.toml

name = "CodeBuddy 记忆同步到 Workspace"
prompt = """检查当前对话中是否产生了新的编码偏好、项目约定、或重要上下文信息。如果有，将它们追加保存到 /workspace/.codebuddy/rules/project-memory.md 文件中。不要覆盖已有内容，只追加新的条目。如果本轮没有新的记忆内容，直接回复「无新增记忆」即可。"""
scheduleType = "recurring"
rrule = "FREQ=HOURLY;INTERVAL=1"
cwds = ["/workspace"]
status = "ACTIVE"
